name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write   # create tags, GitHub Release, upload assets
      packages: write   # publish to GitHub Packages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # required for git describe to find previous tags

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Type-check
        run: bun run typecheck

      - name: Run tests
        run: bun test

      # Reads the latest vX.Y.Z tag and increments the patch number.
      # First-ever release starts at v0.1.0 (from the fallback v0.0.0).
      - name: Compute next version
        id: version
        run: |
          latest=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          major=$(echo "$latest" | cut -d. -f1 | tr -d 'v')
          minor=$(echo "$latest" | cut -d. -f2)
          patch=$(echo "$latest" | cut -d. -f3)
          next="v${major}.${minor}.$((patch + 1))"
          echo "tag=$next" >> "$GITHUB_OUTPUT"
          echo "semver=${next#v}" >> "$GITHUB_OUTPUT"
          echo "Next release: $next"

      # Bun supports cross-compilation from a single runner via --target
      - name: Build compiled binaries (all platforms)
        run: |
          bun build --compile src/index.ts --target bun-linux-x64    --outfile dist/fbcli-linux-x64
          bun build --compile src/index.ts --target bun-linux-arm64  --outfile dist/fbcli-linux-arm64
          bun build --compile src/index.ts --target bun-darwin-x64   --outfile dist/fbcli-darwin-x64
          bun build --compile src/index.ts --target bun-darwin-arm64 --outfile dist/fbcli-darwin-arm64

      # Print SHA256 values — copy these into HomebrewFormula/fbcli.rb
      - name: Print SHA256 checksums
        run: |
          echo "=== SHA256 checksums (paste into HomebrewFormula/fbcli.rb) ==="
          sha256sum dist/fbcli-linux-x64
          sha256sum dist/fbcli-linux-arm64
          sha256sum dist/fbcli-darwin-x64
          sha256sum dist/fbcli-darwin-arm64

      - name: Create and push tag
        run: |
          git tag ${{ steps.version.outputs.tag }}
          git push origin ${{ steps.version.outputs.tag }}

      - name: Create GitHub Release and upload binaries
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            dist/fbcli-linux-x64
            dist/fbcli-linux-arm64
            dist/fbcli-darwin-x64
            dist/fbcli-darwin-arm64

      # Stamp the computed version into package.json before publishing
      # (no commit needed — the git tag is the source of truth)
      - name: Build JS bundle and publish to GitHub Packages
        run: |
          sed -i "s/\"version\": \"[^\"]*\"/\"version\": \"${{ steps.version.outputs.semver }}\"/" package.json
          bun run build
          bun publish
        env:
          BUN_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
